<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your website · ORELVI</title>
<meta name="description" content="A free website proof from ORELVI.">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url(../fonts/schibsted.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/plex-mono.woff2) format("woff2");font-weight:500;font-display:swap}
:root{--paper:#060607;--ink:#f4f2ee;--ink-2:#c3beb5;--ink-3:#97928a;--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.045);
  --amber:#f2cf98;--ok:#9fd8b8;--bad:#f0a48f;--ff:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 var(--ff);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60rem 30rem at 85% -10%,rgba(242,190,120,.12),transparent 60%),radial-gradient(50rem 30rem at -10% 10%,rgba(255,255,255,.06),transparent 60%)}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.shell{max-width:1120px;margin:0 auto;padding:0 16px}
@media (min-width:700px){.shell{padding:0 32px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.mark{font:800 20px/1 var(--ff);letter-spacing:.18em;text-decoration:none}
.k{font:500 12px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{font:800 clamp(34px,6vw,60px)/1.02 var(--ff);letter-spacing:-.025em;margin:28px 0 14px;text-wrap:balance}
h2{font:800 clamp(24px,3.4vw,34px)/1.1 var(--ff);letter-spacing:-.02em;margin:0 0 16px}
.lede{font-size:clamp(17px,2vw,20px);color:var(--ink-2);max-width:36rem;margin:0 0 10px}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--ink-2)}
.tiers{display:grid;gap:16px;margin:28px 0 8px}
@media (min-width:900px){.tiers{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tier{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--glass);
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 28px 70px -30px rgba(0,0,0,.9)}
.tier.pick{border-color:rgba(242,207,152,.6)}
.tier h3{margin:0;font:800 22px/1.2 var(--ff)}
.price{font:800 40px/1 var(--ff);letter-spacing:-.02em;margin:0}
.price small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0}
.for{margin:0;color:var(--ink-2)}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.tier li{padding-left:22px;position:relative}
.tier li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:6px;border-left:2px solid var(--amber);border-bottom:2px solid var(--amber);transform:rotate(-45deg)}
.tier li b{color:var(--ink);font-weight:700}
.tier .go{margin-top:auto;display:grid;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font:700 16px/1.2 var(--ff);
  text-decoration:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-align:center}
.btn.main{background:var(--ink);color:#0b0b0c}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:default}
.fine{margin:0;font-size:13px;color:var(--ink-3);line-height:1.45}
.band{margin:44px 0;padding:28px 24px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:18px;counter-reset:s}
@media (min-width:800px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.steps li{counter-increment:s;display:grid;gap:4px;align-content:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font:700 15px/1 var(--ff);margin-bottom:6px}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#0b0b0c}
.steps b{font-size:17px}
.steps span{color:var(--ink-2);font-size:15px;line-height:1.5}
form.card{display:grid;gap:14px;max-width:40rem}
.row2{display:grid;gap:14px}
@media (min-width:640px){.row2{grid-template-columns:1fr 1fr}}
label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2)}
label .opt{font-weight:500;color:var(--ink-3)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
textarea{min-height:96px;resize:vertical}
input[aria-invalid="true"]{border-color:var(--bad)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
legend{font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.choice{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;color:var(--ink)}
.choice input{width:20px;height:20px;min-height:0;margin:0;flex:none}
.msg{margin:0;padding:14px 16px;border-radius:12px;border:1px solid var(--line)}
.msg.ok{border-color:var(--ok)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.hp{position:absolute;left:-9999px}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;min-height:28px}
details p{color:var(--ink-2);margin:8px 0 0;max-width:42rem}
.foot{padding:30px 0 50px;color:var(--ink-3);font-size:14px;border-top:1px solid var(--line);margin-top:40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="shell" style="min-height:70vh;display:grid;place-items:center;text-align:center">
  <div><p class="wait on" id="w" role="status" style="justify-content:center"><span class="spin" aria-hidden="true"></span><span>Opening your website.</span></p>
  <div id="x" hidden><h1 style="font-size:32px">We could not open that website.</h1><p class="lede" id="xm"></p><p><a class="btn main" href="../account/">Go to my account</a></p></div></div>
</div>
<style>.wait{display:flex;align-items:center;gap:10px;color:var(--ink-2)}.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--amber);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style>
<script>
(function(){
  var API = "https://kupitpaodqqwjjuhawvv.supabase.co/functions/v1/orelvi-assistant", s = new URLSearchParams(location.search).get('s') || '';
  function fail(m){ document.getElementById('w').hidden = true; document.getElementById('x').hidden = false; document.getElementById('xm').textContent = m; }
  if (!/^[a-z0-9-]{1,80}$/.test(s)) return fail('The link looks cut off. Open it from your account instead.');
  var mine = false; try { mine = !!localStorage.getItem('orelvi-session'); } catch (e) {}
  fetch(API + '/proof?s=' + encodeURIComponent(s)).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) return fail(j.message || 'It may have been taken down.');
    var html = j.html;
    /* the owner, signed in, gets a way back to their account on top of their site */
    if (mine) html = html.replace(/<\/body>/i, '<a href="../account/" style="position:fixed;z-index:2147483000;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#0b0b0c;color:#f4f2ee;font:600 14px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.35)">&larr; My account</a></body>');
    document.open(); document.write(html); document.close();
  }).catch(function(){ fail('We could not reach the server. Check your connection and try again.'); });
})();
</script>
</body>
</html>

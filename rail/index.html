<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORELVI · On the rail</title>
<meta name="description" content="Browse ORELVI websites like clothes on a rail. Swipe to browse, tap to explore.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20110%20100%22%3E%3Crect%20width%3D%22110%22%20height%3D%22100%22%20rx%3D%2218%22%20fill%3D%22%23050506%22%2F%3E%3Cg%20transform%3D%22skewY(-24)%20translate(0%2032)%22%20fill%3D%22%23fff%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%3E%3Crect%20x%3D%2238%22%20y%3D%2212%22%20width%3D%2260%22%20height%3D%2266%22%20rx%3D%229%22%20fill-opacity%3D%22.22%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2224%22%20width%3D%2238%22%20height%3D%2254%22%20rx%3D%228%22%20fill-opacity%3D%22.38%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
@font-face{font-family:"Schibsted Grotesk";src:url(../fonts/schibsted.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/plex-mono.woff2) format("woff2");font-weight:500;font-display:swap}

:root{
  --paper:#f4f2ee; --ink:#121214; --ink-2:#55565c; --ink-3:#8a8b91; --rule:rgba(18,18,20,.14);
  --stamp:#d8391c; --stamp-ink:#fff;
  --metal-1:#f2f2f0; --metal-2:#b9b9b5; --metal-3:#8e8e8a;
  --wood-1:#b46a3c; --wood-2:#7a3a1c;
  --card-shadow:0 30px 40px -24px rgba(20,16,10,.45),0 6px 14px -6px rgba(20,16,10,.25);
  --scrim:rgba(244,242,238,.62);
  --display:"Schibsted Grotesk",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e0e10; --ink:#f2f2f4; --ink-2:#a9aab2; --ink-3:#75767e; --rule:rgba(255,255,255,.14);
  --stamp:#e2492b; --metal-1:#d8d8d6; --metal-2:#8a8a87; --metal-3:#5a5a58;
  --card-shadow:0 30px 44px -22px rgba(0,0,0,.85),0 6px 14px -6px rgba(0,0,0,.6);
  --scrim:rgba(14,14,16,.66); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e0e10; --ink:#f2f2f4; --ink-2:#a9aab2; --ink-3:#75767e; --rule:rgba(255,255,255,.14);
  --stamp:#e2492b; --metal-1:#d8d8d6; --metal-2:#8a8a87; --metal-3:#5a5a58;
  --card-shadow:0 30px 44px -22px rgba(0,0,0,.85),0 6px 14px -6px rgba(0,0,0,.6);
  --scrim:rgba(14,14,16,.66); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--stamp);outline-offset:3px;border-radius:6px}

/* Header */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px max(16px,4vw) 0}
.burger{width:40px;height:30px;display:grid;align-content:center;gap:7px}
.burger i{display:block;height:2px;width:40px;background:var(--ink)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(26px,6.4vw,38px);letter-spacing:-.01em}
.logo svg{width:1.05em;height:1.05em}
.shop{justify-self:end;display:flex;gap:18px;align-items:center;font-size:clamp(16px,3.6vw,20px)}
.shop span{font-size:1.15em}

.eyebrow{display:flex;justify-content:center;gap:clamp(14px,4vw,30px);margin:clamp(34px,7vh,60px) 0 0;
  font-size:clamp(13px,3vw,16px);letter-spacing:.08em;text-transform:uppercase}
.eyebrow b{font-weight:500}
.eyebrow i{font-style:normal;color:var(--ink-3)}
.eyebrow em{font-style:normal;color:var(--ink-2)}

/* Rail */
.stage{position:relative;margin:clamp(28px,5vh,46px) auto 0;width:min(100% - 32px,1100px);
  height:440px;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.rail{position:absolute;left:0;right:0;top:12px;height:9px;border-radius:9px;z-index:5;
  background:linear-gradient(var(--metal-1),var(--metal-2) 55%,var(--metal-3));box-shadow:0 3px 6px -2px rgba(0,0,0,.25)}
.rail::before,.rail::after{content:"";position:absolute;top:-11px;width:22px;height:31px;border-radius:5px;
  background:linear-gradient(90deg,var(--metal-3),var(--metal-1) 45%,var(--metal-2));box-shadow:0 3px 6px -2px rgba(0,0,0,.3)}
.rail::before{left:-6px}.rail::after{right:-6px}

.item{position:absolute;left:50%;top:16px;width:var(--w);margin-left:calc(var(--w) / -2);
  transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s;will-change:transform}
.item[hidden]{display:block;opacity:0;pointer-events:none}
.swing{transform-origin:50% 0;transform-style:preserve-3d}
.item.moved .swing{animation:swing 1.5s cubic-bezier(.3,.6,.3,1)}
@keyframes swing{0%{transform:rotateZ(var(--kick,4deg))}30%{transform:rotateZ(calc(var(--kick,4deg) * -.55))}
  55%{transform:rotateZ(calc(var(--kick,4deg) * .28))}78%{transform:rotateZ(calc(var(--kick,4deg) * -.1))}100%{transform:none}}

.wire{display:block;margin:0 auto;width:2px;height:var(--wire,46px);background:linear-gradient(var(--metal-3),var(--metal-2))}
.hanger{display:block;width:72%;margin:-2px auto 0;height:auto;overflow:visible}
.card{position:relative;margin:-6px auto 0;width:100%;aspect-ratio:10/13;border-radius:10px;overflow:hidden;
  background:#fff;box-shadow:var(--card-shadow)}
.card img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,var(--shade,0)),rgba(0,0,0,0) 70%);transition:background .7s}
.clip{position:absolute;top:-3px;width:16px;height:22px;border-radius:3px;z-index:2;
  background:linear-gradient(90deg,var(--metal-3),var(--metal-1) 50%,var(--metal-2));box-shadow:0 2px 3px rgba(0,0,0,.3)}
.clip.l{left:14%}.clip.r{right:14%}

/* Copy under the rail */
.meta{text-align:center;margin-top:clamp(4px,2vh,18px)}
.meta h1{margin:0;font-weight:500;font-size:clamp(22px,5vw,28px);letter-spacing:-.01em;min-height:1.3em}
.meta p{margin:12px 0 0;color:var(--ink-3);font-size:clamp(17px,4vw,21px)}
.pager{display:flex;justify-content:center;align-items:center;gap:clamp(60px,18vw,90px);margin-top:clamp(26px,5vh,48px);
  font-family:var(--mono);color:var(--ink-2);font-size:clamp(16px,3.8vw,19px);letter-spacing:.06em}
.pager button{font-size:30px;line-height:1;color:var(--ink-2);padding:6px 10px}
.cta{display:flex;justify-content:center;margin:clamp(26px,5vh,46px) 0 clamp(30px,6vh,60px)}
.cta a{display:inline-flex;align-items:center;gap:38px;padding:24px 38px;border-radius:999px;border:1.5px solid var(--rule);
  font-size:clamp(18px,4.2vw,21px);transition:background .25s,border-color .25s}
.cta a:hover{border-color:var(--ink)}

/* Marquee */
.ticker{margin-top:auto;background:var(--stamp);color:var(--stamp-ink);overflow:hidden;white-space:nowrap;
  padding:20px 0 calc(20px + env(safe-area-inset-bottom))}
.ticker div{display:inline-flex;gap:56px;animation:tick 28s linear infinite;padding-left:46px;font-size:clamp(15px,3.6vw,18px)}
.ticker span{display:inline-flex;gap:56px;align-items:center}
.ticker svg{width:22px;height:22px;flex:none}
@keyframes tick{to{transform:translateX(-50%)}}

/* Detail sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
  background:var(--scrim);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);
  opacity:0;pointer-events:none;transition:opacity .4s;overflow-y:auto}
.sheet.open{opacity:1;pointer-events:auto}
.close{position:absolute;top:20px;right:max(16px,4vw);display:flex;align-items:center;gap:22px;font-size:20px;z-index:2}
.close svg{width:26px;height:26px}
.show{position:relative;margin-top:44px;width:min(100% - 32px,720px);display:flex;justify-content:center;
  transform:translateY(30px) scale(.94);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.sheet.open .show{transform:none}
.show .wire{--wire:56px;position:absolute;left:50%;top:0;margin-left:-1px}
.frame{margin-top:62px;position:relative;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .3s}
.frame.flip{transform:rotateY(90deg);opacity:.2}
.frame .hanger{position:absolute;left:50%;top:-40px;width:180px;margin-left:-90px}
.frame img{display:block;border-radius:12px;box-shadow:var(--card-shadow);background:#fff;object-fit:cover;object-position:50% 0}
.frame.mobile img{width:min(58vw,250px);aspect-ratio:390/700}
.frame.desktop img{width:min(100vw - 48px,640px);aspect-ratio:1440/900}
.info{text-align:center;width:min(100% - 32px,560px);margin:30px auto 40px}
.info .n{font-family:var(--mono);color:var(--ink-3);letter-spacing:.06em;font-size:16px}
.info h2{margin:14px 0 0;font-weight:500;font-size:clamp(34px,8vw,44px);letter-spacing:-.015em}
.info .sub{margin:10px 0 0;color:var(--ink-3);font-size:clamp(17px,4vw,20px)}
.tabs{display:flex;justify-content:center;gap:clamp(40px,12vw,64px);margin-top:28px}
.tabs button{font-size:clamp(18px,4.4vw,21px);color:var(--ink-3);padding:6px 4px 16px;width:118px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1.5px solid var(--rule);margin-top:24px;padding-top:24px;font-size:clamp(17px,4.2vw,20px)}
.row a{color:var(--stamp)}
.buy{display:block;margin:26px auto 0;width:100%;padding:18px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:18px;text-align:center}

@media (min-width:900px){

  .meta{margin-top:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header>
  <button class="burger" aria-label="Back to ORELVI" onclick="location.href='../index.html'"><i></i><i></i><i></i></button>
  <a class="logo" href="../index.html" aria-label="ORELVI home">
    <svg viewBox="0 0 110 100" aria-hidden="true"><g transform="skewY(-24) translate(0 32)" fill="currentColor" stroke="currentColor" stroke-width="3"><rect x="38" y="12" width="60" height="66" rx="9" fill-opacity=".25"/><rect x="12" y="24" width="38" height="54" rx="8" fill-opacity=".55"/></g></svg>
    ORELVI
  </a>
  <a class="shop" href="../index.html#pricing">Pricing <span aria-hidden="true">&nearr;</span></a>
</header>

<main>
  <div class="eyebrow"><b>On the rail</b><i aria-hidden="true">|</i><em id="eyebrow-count">ORELVI / 14 sites</em></div>

  <div class="stage" id="stage" role="region" aria-roledescription="carousel" aria-label="Websites on the rail">
    <div class="rail" aria-hidden="true"></div>
  </div>

  <div class="meta" aria-live="polite">
    <h1 id="name"></h1>
    <p>Swipe to browse. Tap to explore.</p>
  </div>

  <div class="pager">
    <button id="prev" aria-label="Previous website">&larr;</button>
    <span id="count">01 / 14</span>
    <button id="next" aria-label="Next website">&rarr;</button>
  </div>

  <div class="cta"><a href="../index.html">Explore ORELVI <span aria-hidden="true">&nearr;</span></a></div>
</main>

<div class="ticker" aria-hidden="true"><div id="ticker"></div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name" aria-hidden="true">
  <button class="close" id="close">Close <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
  <div class="show">
    <span class="wire" aria-hidden="true"></span>
    <div class="frame mobile" id="frame">
      <svg class="hanger" viewBox="0 0 180 46" aria-hidden="true"><use href="#hanger-shape"/></svg>
      <img id="d-img" alt="">
    </div>
  </div>
  <div class="info">
    <div class="n" id="d-count"></div>
    <h2 id="d-name"></h2>
    <p class="sub" id="d-sub"></p>
    <div class="tabs" role="tablist">
      <button role="tab" id="t-mobile" aria-selected="true">Phone</button>
      <button role="tab" id="t-desktop" aria-selected="false">Desktop</button>
    </div>
    <div class="row"><span id="d-tier"></span><a id="d-live" href="#">View the live site &nearr;</a></div>
    <a class="buy" href="../index.html#book">I want one like this</a>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c47a48"/><stop offset="1" stop-color="#7a3a1c"/></linearGradient>
    <symbol id="hanger-shape" viewBox="0 0 180 46">
      <path d="M90 2 C90 2 90 10 90 12 L14 34 Q4 37 6 42 L174 42 Q176 37 166 34 L90 12" fill="none" stroke="url(#wood)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <rect x="4" y="38" width="172" height="7" rx="3.5" fill="url(#wood)"/>
    </symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="M12 0c.6 6.4 5.6 11.4 12 12-6.4.6-11.4 5.6-12 12-.6-6.4-5.6-11.4-12-12C6.4 11.4 11.4 6.4 12 0z" fill="currentColor"/></symbol>
  </defs>
</svg>

<script>
// Both lines are rewritten by showcase:build from the concepts and the prices in settings.
const TIERS = {"signature":["Signature","$899"],"custom":["Custom","from $1,899"]}; //@data
const SITES = [{"slug":"premium-automotive","name":"Meridian Detail Studio","kind":"Paint Correction & Coating","city":"Scottsdale, AZ","tier":"custom"},{"slug":"creative-portfolio","name":"Cass Harlow Studio","kind":"Architectural Photography","city":"Chicago, IL","tier":"custom"},{"slug":"hospitality-table","name":"Ember & Ash","kind":"Wood-Fired Kitchen","city":"Eugene, OR","tier":"custom"},{"slug":"architectural-contractor","name":"Ridgeline Roofing Co.","kind":"Roofing & Exteriors","city":"Bellingham, WA","tier":"signature"},{"slug":"landscape-outdoor","name":"Foxglove & Stone","kind":"Garden Design & Build","city":"Asheville, NC","tier":"signature"},{"slug":"barber-grooming","name":"Copperline Barbers","kind":"Barbershop","city":"Savannah, GA","tier":"signature"},{"slug":"salon-beauty","name":"Maren & Ivy","kind":"Hair Studio","city":"Providence, RI","tier":"signature"},{"slug":"luxury-minimal","name":"Alder & Vale Dental","kind":"General & Cosmetic Dentistry","city":"Burlington, VT","tier":"signature"}]; //@data

const N = SITES.length, pad = n => String(n).padStart(2,"0");
const $ = id => document.getElementById(id);
const stage = $("stage"), items = [];
let cur = 0;

document.getElementById("eyebrow-count").textContent = `ORELVI / ${N} sites`;

// Build the hangers
SITES.forEach((s,i) => {
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `<div class="swing"><span class="wire"></span>
    <svg class="hanger" viewBox="0 0 180 46" aria-hidden="true"><use href="#hanger-shape"/></svg>
    <div class="card"><span class="clip l"></span><span class="clip r"></span>
      <img src="../work/${s.slug}/shot-phone.jpg" alt="${s.name} website" loading="${i<3||i>N-3?"eager":"lazy"}" draggable="false"></div></div>`;
  el.addEventListener("click", () => { if (dragMoved) return; const d = offset(i); d === 0 ? openSheet() : go(cur + d); });
  stage.appendChild(el); items.push(el);
});

// Ticker
const phrases = ["Built for you, before you pay.","Pay only if you launch.","Hand-made sites for local businesses."];
const run = phrases.map(p => `<span>${p}<svg><use href="#star"/></svg></span>`).join("");
$("ticker").innerHTML = run + run + run + run;

function offset(i){ let d = (i - cur) % N; if (d > N/2) d -= N; if (d < -N/2) d += N; return d; }

function layout(dragPx = 0){
  const W = stage.clientWidth, wide = W >= 760;
  const cw = Math.min(wide ? 300 : W * .62, 300);
  stage.style.setProperty("--w", cw + "px");
  // rail offset + wire + hanger + card + room for the swing shadow
  stage.style.height = Math.round(16 + 46 + cw * .72 * 46 / 180 + cw * 1.3 + 34) + "px";
  const reach = wide ? 2 : 1;
  items.forEach((el,i) => {
    const d = offset(i) + dragPx / (W * .45);
    const a = Math.abs(d), sgn = Math.sign(d);
    let x, ry, sc, z;
    if (a <= 1){ // centre to first neighbour: turn sideways as it slides
      x = d * (wide ? W * .3 : W * .44); ry = -sgn * 78 * a; sc = 1 - .12 * a; z = -a * 120;
    } else {
      x = sgn * ((wide ? W * .3 : W * .44) + (a - 1) * (wide ? W * .14 : W * .2)); ry = -sgn * 80; sc = .88 - (a - 1) * .06; z = -120 - (a - 1) * 60;
    }
    el.style.transform = `translateX(${x}px) translateZ(${z}px) rotateY(${ry}deg) scale(${sc})`;
    el.style.zIndex = 100 - Math.round(a * 10);
    el.style.opacity = a > reach + .6 ? 0 : 1;
    el.style.pointerEvents = a > reach + .2 ? "none" : "";
    el.querySelector(".card").style.setProperty("--shade", Math.min(a, 1) * .35);
    el.toggleAttribute("aria-hidden", Math.round(a) !== 0);
  });
}

function go(n, kick){
  const prev = cur; cur = ((n % N) + N) % N;
  if (prev === cur) return layout();
  const dir = Math.sign(offset(prev)) || 1;
  items.forEach(el => { el.classList.remove("moved"); void el.offsetWidth; el.style.setProperty("--kick", (kick ?? 5 * -dir) + "deg"); el.classList.add("moved"); });
  render();
}
function render(){
  const s = SITES[cur];
  $("name").textContent = s.name;
  $("count").textContent = `${pad(cur+1)} / ${pad(N)}`;
  stage.classList.remove("dragging");
  items.forEach(el => el.style.transition = "");
  layout();
}

$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
addEventListener("resize", () => layout());
addEventListener("keydown", e => {
  if (sheet.classList.contains("open")) { if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "Enter" && document.activeElement === document.body) openSheet();
});

// Swipe / drag
let startX = null, dx = 0, dragMoved = false;
stage.addEventListener("pointerdown", e => { startX = e.clientX; dx = 0; dragMoved = false; });
addEventListener("pointermove", e => {
  if (startX === null) return;
  dx = e.clientX - startX;
  if (!dragMoved && Math.abs(dx) > 8){ dragMoved = true; stage.classList.add("dragging"); items.forEach(el => el.style.transition = "none"); }
  if (dragMoved) layout(dx);
});
addEventListener("pointerup", () => {
  if (startX === null) return;
  startX = null;
  if (dragMoved){
    const steps = Math.round(-dx / (stage.clientWidth * .3)) || (Math.abs(dx) > 40 ? -Math.sign(dx) : 0);
    steps ? go(cur + steps, Math.max(-9, Math.min(9, dx / 18))) : render();
    setTimeout(() => dragMoved = false, 0);
  }
});

// Detail sheet
const sheet = $("sheet"), frame = $("frame");
let view = "mobile", lastFocus = null;
function fillSheet(){
  const s = SITES[cur];
  $("d-count").textContent = `${pad(cur+1)} / ${pad(N)}`;
  $("d-name").textContent = s.name;
  $("d-sub").textContent = `${s.kind} · ${s.city}`;
  $("d-tier").textContent = `${TIERS[s.tier][0]} · ${TIERS[s.tier][1]}`;
  $("d-live").href = `../work/${s.slug}/index.html`;
  $("d-img").src = `../work/${s.slug}/shot-${view === "mobile" ? "phone" : "desktop"}.jpg`;
  $("d-img").alt = `${s.name}, ${view === "mobile" ? "phone" : "desktop"} view`;
  frame.className = "frame " + view;
  $("t-mobile").setAttribute("aria-selected", view === "mobile");
  $("t-desktop").setAttribute("aria-selected", view === "desktop");
}
function openSheet(){ view = "mobile"; fillSheet(); lastFocus = document.activeElement; sheet.classList.add("open"); sheet.setAttribute("aria-hidden","false"); $("close").focus(); }
function closeSheet(){ sheet.classList.remove("open"); sheet.setAttribute("aria-hidden","true"); lastFocus?.focus?.(); }
function setView(v){
  if (v === view) return;
  frame.classList.add("flip");
  setTimeout(() => { view = v; fillSheet(); frame.classList.remove("flip"); }, 300);
}
$("close").onclick = closeSheet;
$("t-mobile").onclick = () => setView("mobile");
$("t-desktop").onclick = () => setView("desktop");
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });

// Start part-way in, like the reel
cur = 0;
render();
</script>
</body>
</html>
